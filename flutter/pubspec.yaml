name: mealio_sdk
description: >-
  Mealio Cart SDK for Flutter. Adds a recipe's ingredients to the user's own
  grocery store cart, driven by signed instructions from Mealio.
version: 0.5.0
homepage: https://developers.mealio.co
repository: https://github.com/stephengreer97/mealio_sdk/tree/main/flutter
issue_tracker: https://github.com/stephengreer97/mealio_sdk/issues
documentation: https://developers.mealio.co/docs/flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # VERIFY: these floors resolve on Flutter 3.19 and the APIs used
  # (UrlChange, WebResourceError.isForMainFrame, setInspectable,
  # setAcceptThirdPartyCookies) exist at the resolved versions.
  cryptography: ^2.7.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  webview_flutter: ^4.7.0
  # Platform implementations, imported directly for Android third-party
  # cookies and iOS inspectability. The ranges follow what webview_flutter
  # itself accepts.
  webview_flutter_android: ">=3.16.0 <5.0.0"
  webview_flutter_wkwebview: ^3.13.0
  # The fake WebView platform in package:mealio_sdk/testing.dart.
  webview_flutter_platform_interface: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
