name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole suite before it publishes anything.
  workflow_call:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # What `npm publish` would upload, without uploading it.
      - run: npm pack --dry-run -w @mealio/sdk-core -w @mealio/react-native-cart
      - run: node scripts/check-versions.mjs
      # The agent skill still matches the SDK, both ways.
      - run: node scripts/check-skill.mjs

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :mealio-sdk:testDebugUnitTest :mealio-sdk:assembleRelease :mealio-sdk-compose:assembleRelease
      # The Maven Central artifacts (AAR, sources, javadoc, POM), unsigned, to the local repo.
      - run: ./gradlew publishToMavenLocal

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -scheme MealioSDK -destination 'platform=iOS Simulator,name=iPhone 16' test
      # The root Package.swift is what Swift Package Manager users get.
      - run: swift build
        working-directory: .
      - run: pod lib lint MealioSDK.podspec --allow-warnings
        working-directory: .
