name: release

# Push a tag `vX.Y.Z` to publish every SDK at that version:
#   npm         @mealio/sdk-core, @mealio/react-native-cart
#   Maven       co.mealio:mealio-sdk, co.mealio:mealio-sdk-compose, co.mealio:mealio-sdk-testing (Central Portal)
#   SwiftPM     MealioSDK reads the tag itself, as does CocoaPods from git:
#               pod 'MealioSDK', :git => '<repo>', :tag => 'vX.Y.Z'
#               (CocoaPods Trunk goes read-only for good on 2026-12-02, so
#               nothing is pushed there: a Trunk install would be frozen.)
#   pub.dev     mealio_sdk
#
# Every version in the repo must equal the tag (scripts/check-versions.mjs),
# and the full test suite runs first. Secrets this needs, once:
#   (npm needs no secret: Trusted Publishing, configured on npmjs.com)
#   MAVEN_CENTRAL_USERNAME / _PASSWORD Central Portal user token
#   SIGNING_KEY / SIGNING_KEY_PASSWORD ASCII-armored GPG private key + passphrase
# pub.dev needs no secret: it trusts this workflow through GitHub OIDC once
# "Automated publishing" is enabled for the package on pub.dev (after the
# first version is published by hand).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"
      # Partners download the skill from the site, so that copy has to be current.
      - run: node scripts/check-skill.mjs --hosted

  tests:
    needs: versions
    uses: ./.github/workflows/ci.yml

  npm:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing: GitHub OIDC, no stored token
    steps:
      - uses: actions/checkout@v4
      # npm stage publish needs npm 11.15+ on Node 22.14+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @mealio/sdk-core -w @mealio/react-native-cart
      # STAGED, not published: each version waits in npm's review queue until a
      # maintainer approves it with 2FA (npmjs.com, or `npm stage approve`).
      # No token: both packages trust this workflow (Trusted Publishing, set up
      # on npmjs.com per package: stephengreer97/mealio_sdk, release.yml).
      # Core first: the React Native package depends on this exact version.
      - run: npm stage publish --access public
        working-directory: packages/core
      - run: npm stage publish --access public
        working-directory: packages/react-native

  maven:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  pub:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # pub.dev trusts this workflow via OIDC
    steps:
      - uses: actions/checkout@v4
      # setup-dart exchanges the GitHub OIDC token for a pub.dev credential.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      # pub.dev takes a package's FIRST version only by hand, so that one may
      # already be live when its tag is pushed. Skip a version that exists.
      - id: live
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -fsS https://pub.dev/api/packages/mealio_sdk | grep -q "\"version\":\"$v\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "mealio_sdk $v is already on pub.dev"
          fi
      - if: steps.live.outputs.skip != 'true'
        run: flutter pub publish --force
        working-directory: flutter
